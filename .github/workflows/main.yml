# Publishing a release with tag vX.Y.Z builds BatteryWidget.exe
# and attaches the executable and its checksum to that release.

name: Build and publish

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Compiler (Mono, builds for .NET Framework 4.8)
        run: |
          set -euo pipefail

          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends mono-devel

          mcs --version

      - name: Validate version and update source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          echo "Release tag: '$RELEASE_TAG'"

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid release tag '$RELEASE_TAG'. Expected vX.Y.Z, for example v3.0.2."
            exit 1
          fi

          VER="${RELEASE_TAG#v}"

          python3 - "$VER" <<'PY'
          import sys

          _, version = sys.argv
          parts = [int(part) for part in version.split(".")]

          if any(part > 65534 for part in parts):
              raise SystemExit(
                  "Version components must be between 0 and 65534."
              )

          print(f"Validated version: {version}")
          PY

          # Make the version available to subsequent steps.
          printf 'VER=%s\n' "$VER" >> "$GITHUB_ENV"

          sed -i \
            "s/public const string Version = \"[0-9.]*\";/public const string Version = \"$VER\";/" \
            src/App.cs

          sed -i \
            "s/AssemblyVersion(\"[0-9.]*\")/AssemblyVersion(\"$VER.0\")/; s/AssemblyFileVersion(\"[0-9.]*\")/AssemblyFileVersion(\"$VER.0\")/" \
            src/App.cs

          sed -i \
            "s|public const string DefaultRepo = \"[^\"]*\";|public const string DefaultRepo = \"$GITHUB_REPOSITORY\";|" \
            src/Updater.cs

          echo "Source updated for version $VER"
          echo "Update repository: $GITHUB_REPOSITORY"

      - name: Sensor library
        run: |
          set -euo pipefail

          python3 tools/get_lhm.py

      - name: Build
        run: |
          set -euo pipefail

          : "${VER:?VER is missing or empty. Check the version step.}"

          echo "Building BatteryWidget version '$VER'"

          python3 res/make_res.py res/icon.ico res/app.res "$VER"

          mkdir -p out
          bash build.sh out/BatteryWidget.exe

          test -s out/BatteryWidget.exe

          cd out
          sha256sum BatteryWidget.exe > BatteryWidget.exe.sha256
          cat BatteryWidget.exe.sha256

      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          : "${GH_TOKEN:?GitHub token is missing.}"
          : "${RELEASE_ID:?Release ID is missing.}"

          API="https://api.github.com/repos/$GITHUB_REPOSITORY/releases"
          UPLOAD_API="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases"

          echo "Uploading to release '$RELEASE_TAG', ID $RELEASE_ID"

          for f in BatteryWidget.exe BatteryWidget.exe.sha256; do
            test -s "out/$f"

            # Find existing assets with the same name.
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API/$RELEASE_ID/assets?per_page=100" \
              > "$RUNNER_TEMP/release-assets.json"

            ASSET_IDS="$(
              python3 - "$RUNNER_TEMP/release-assets.json" "$f" <<'PY'
          import json
          import sys

          _, assets_path, filename = sys.argv

          with open(assets_path, encoding="utf-8") as handle:
              assets = json.load(handle)

          for asset in assets:
              if asset["name"] == filename:
                  print(asset["id"])
          PY
            )"

            # Remove matching assets from an earlier attempt.
            for id in $ASSET_IDS; do
              echo "Removing existing asset '$f', ID $id"

              curl --fail-with-body --silent --show-error \
                -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$API/assets/$id"
            done

            # Upload to the release that triggered this job.
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@out/$f" \
              "$UPLOAD_API/$RELEASE_ID/assets?name=$f" \
              > /dev/null

            echo "Attached $f"
          done
